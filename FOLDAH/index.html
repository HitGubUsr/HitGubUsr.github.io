<script>

  /* =========================
     RANDOM CRAP
     ========================= */

  function randomNonsense() {

    const things = [
      "you have been clutterfunk'd",
      "blu",
      "why did you click that",
      "congratulations. nothing happened.",
      "this website has achieved absolutely nothing",
      "ERROR: boredom detected",
      "have you considered going outside",
      "CLUTTERFUNK LEVEL: 87%",
      "the blue knows",
      "i forgot what this button does"
    ];

    const random =
      things[Math.floor(Math.random() * things.length)];

    const result =
      document.getElementById("randomResult");

    result.textContent =
      random;


    /* =========================
       RANDOM STUPID APPEARANCE
       ========================= */

    const fonts = [
      '"Comic Sans MS", cursive',
      '"Courier New", monospace',
      'Impact, "Arial Black", sans-serif',
      'Georgia, serif',
      'Verdana, sans-serif',
      '"Times New Roman", serif',
      'monospace',
      'cursive'
    ];

    const colors = [
      "#ffffff",
      "#00b8b8",
      "#00b800",
      "#d4d400",
      "#c000c0",
      "#d94f00",
      "#d02020"
    ];

    const sizes = [
      "0.8rem",
      "1rem",
      "1.2rem",
      "1.5rem",
      "2rem",
      "2.5rem",
      "3rem",
      "4rem",
      "5rem"
    ];

    const weights = [
      "bold",
      "900"
    ];

    const transforms = [
      "none",
      "rotate(0deg)",
      "rotate(7deg)",
      "rotate(-7deg)",
      "rotate(13deg)",
      "rotate(-13deg)",
      "rotate(25deg)",
      "rotate(-25deg)",
      "rotate(90deg)",
      "rotate(-90deg)",
      "rotate(180deg)",
      "rotate(180deg) scaleX(-1)"
    ];

    const textTransforms = [
      "none",
      "uppercase",
      "lowercase",
      "capitalize"
    ];

    const decorations = [
      "none",
      "underline",
      "line-through",
      "overline",
      "underline line-through"
    ];

    const alignments = [
      "left",
      "center",
      "right"
    ];

    const randomChoice =
      array =>
        array[Math.floor(Math.random() * array.length)];


    /*
     * Give the result enough freedom to become
     * weird without making it impossible to read.
     */

    result.style.display =
      "inline-block";

    result.style.position =
      "relative";

    result.style.fontFamily =
      randomChoice(fonts);

    result.style.fontSize =
      randomChoice(sizes);

    result.style.fontWeight =
      randomChoice(weights);

    result.style.fontStyle =
      Math.random() < 0.25
        ? "italic"
        : "normal";

    result.style.color =
      randomChoice(colors);

    result.style.textTransform =
      randomChoice(textTransforms);

    result.style.textDecoration =
      randomChoice(decorations);

    result.style.textAlign =
      randomChoice(alignments);

    result.style.letterSpacing =
      (
        Math.random() * 0.6 - 0.2
      ).toFixed(2) + "em";

    result.style.wordSpacing =
      (
        Math.random() * 0.8 - 0.2
      ).toFixed(2) + "em";

    result.style.opacity =
      (
        0.8 +
        Math.random() * 0.2
      ).toFixed(2);

    result.style.transform =
      randomChoice(transforms) +
      " skew(" +
      (
        Math.random() * 8 - 4
      ).toFixed(1) +
      "deg) scaleX(" +
      (
        0.85 +
        Math.random() * 0.45
      ).toFixed(2) +
      ") scaleY(" +
      (
        0.85 +
        Math.random() * 0.45
      ).toFixed(2) +
      ")";

    result.style.textShadow =
      Math.random() < 0.65
        ? (
            Math.floor(Math.random() * 8) +
            "px " +
            Math.floor(Math.random() * 8) +
            "px " +
            colors[Math.floor(Math.random() * colors.length)]
          )
        : "none";


    /*
     * Occasionally shove the text around a little.
     */

    result.style.left =
      (
        Math.random() * 80 - 40
      ).toFixed(0) + "px";

    result.style.top =
      (
        Math.random() * 30 - 15
      ).toFixed(0) + "px";


    /*
     * Sometimes make the result especially stupid.
     */

    if (Math.random() < 0.2) {

      result.style.border =
        "2px dashed " +
        randomChoice(colors);

      result.style.padding =
        Math.floor(
          Math.random() * 10
        ) + "px";

    } else {

      result.style.border =
        "none";

      result.style.padding =
        "0";

    }

  }


  /* =========================
     MAKE IT BLUER
     ========================= */

    const blues = [

      "#0000ff",
      "#001aff",

    ];

    const random =
      blues[Math.floor(Math.random() * blues.length)];

  /* =========================
     FAKE MALWARE
     ========================= */

  function fakeMalware() {

    const message =
      document.getElementById("downloadMessage");

    message.textContent =
      "DOWNLOADING CLUTTERFUNK... 3%... 17%... 99%... wait never mind lol";

    setTimeout(() => {

      const fileContent =
        "CLUTTERFUNK.EXE\n\n" +
        "Congratulations.\n" +
        "You downloaded a text file.\n" +
        "It is not malware.\n" +
        "You have been clutterfunk'd.";

      const blob =
        new Blob(
          [fileContent],
          { type: "text/plain" }
        );

      const url =
        URL.createObjectURL(blob);

      const link =

      link.href = url;

      link.download = "CLUTTERFUNK.txt";

      link.click();

      "bruh",
      "the button has been clicked",
      "this changes nothing",

  /* =========================
     POLYESTER SPIDER-MAN EDIT
     ========================= */

  function spawnSpiderManEdit() {

    const spider =
      document.createElement("div");

    spider.className =
      "spiderman-edit";

    spider.innerHTML = `
      <video autoplay playsinline>
        <source
          src="polyester-spiderman-edit.mp4"
          type="video/mp4"
        >

        Your browser does not support MP4 video.
      </video>
    `;

    document.body.appendChild(spider);


    /*
     * Give the browser one frame to figure out
     * the video's size before positioning it.
     */

    requestAnimationFrame(() => {

      const margin = 10;

      const maxX =
        Math.max(
          margin,
          window.innerWidth -
          spider.offsetWidth -
          margin
        );

      const maxY =
        Math.max(
          margin,
          window.innerHeight -
          spider.offsetHeight -
          margin
        );

      const randomX =
        margin +
        Math.random() *
        Math.max(0, maxX - margin);

      const randomY =
        margin +
        Math.random() *
        Math.max(0, maxY - margin);

      spider.style.left =
        randomX + "px";

      spider.style.top =
        randomY + "px";

    });


    const video =
      spider.querySelector("video");


    /*
     * Remove this particular Spider-Man
     * when its video finishes.
     */

    video.addEventListener(
      "ended",
      () => {
        spider.remove();
      }
    );


    /*
     * Remove the box if the video cannot
     * be loaded.
     */

    video.addEventListener(
      "error",
      () => {

        spider.remove();

        console.error(
          "Could not load polyester-spiderman-edit.mp4"
        );

      }
    );

  }


  /* =========================
     STUPID CURSOR TRAIL
     ========================= */

  const stupidThings = [
    "🔵",
    "blu",
    "💀",
    "???",
    "🦠",
    "💥",
    "🗿",
    "🧀",
    "HELP",
    "bruh",
    "✨",
    "💾"
  ];

  document.addEventListener(
    "mousemove",
    function(event) {

      const dot =
        document.createElement("div");

      dot.className =
        "cursor-dot";

      dot.textContent =
        stupidThings[
          Math.floor(
            Math.random() *
            stupidThings.length
          )
        ];

      dot.style.left =
        (
          event.clientX +
          Math.random() * 20 -
          10
        ) + "px";

      dot.style.top =
        (
          event.clientY +

          10
        ) + "px";

      document.body.appendChild(dot);

      setTimeout(() => {

        dot.remove();

      }, 800);

  );

</script>
